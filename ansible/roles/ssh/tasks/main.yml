- name: SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
