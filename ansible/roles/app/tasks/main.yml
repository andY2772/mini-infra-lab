- name: System user for app
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    home: "{{ app_dir }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: App dir
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Index site
  ansible.builtin.copy:
    dest: "{{ app_dir }}/index.html"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    content: "<h1>Hello z VM1</h1>\n"

- name: Systemd unit
  ansible.builtin.copy:
    src: demoapp.service
    dest: /etc/systemd/system/demoapp.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart demoapp

- name: Service runs and is on on start
  ansible.builtin.systemd:
    name: demoapp
    state: started
    enabled: true
    daemon_reload: true
