- name: Allow SSH from lab network
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ lab_net }}"

- name: Allow node exporter from lab netwrok
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ lab_net }}"

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Enable firewall with default deny
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Configuration fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
      findtime = 10m
  notify: Restart fail2ban

- name: fail2ban runs and its on on start
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
